<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #area{
            background-color: #cddcff;
            width: 300px;
            height: 300px;
            color: blue;
            font-size: 2em;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            line-height: 250px;
            border-radius: 10px;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.192);
            border: 4px solid rgb(126, 64, 196);
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        interaja...
    </div>

    <script>
       var a = document.getElementById('area') 
       /*
       a.addEventListener('click', clicar)
       a.addEventListener('mouseenter', entrar)
       a.addEventListener('mouseout', sair)
       */

       function clicar(){
            a.innerText = 'clicou!'
            a.style.background = 'red'
            a.style.color = 'black'
        }
        
       function entrar(){
            a.innerText = 'entrou!'
        }
        
       function sair(){
            a.innerText = 'saiu!'
            a.style.background = '#cddcff'
            a.style.color = 'blue'
        }
    </script>
</body>
</html>
